<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>맞춤형 교내외활동 탐색 (프로토타입)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>맞춤형 교내외활동 탐색</h1>
    <span class="sample-note" id="sample-note"></span>
  </header>

  <main class="layout">
    <section class="panel filters" id="filters" aria-labelledby="filters-title">
      <h2 id="filters-title">조건 설정</h2>
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-body"></button>
      <div id="filter-body" class="filter-body">
        <div id="filter-groups"></div>
        <div class="filter-actions">
          <button type="button" id="reset-btn" class="btn">조건 초기화</button>
          <button type="button" id="filter-apply" class="btn btn-primary filter-apply"></button>
        </div>
      </div>
    </section>

    <section class="panel results" aria-labelledby="results-title">
      <h2 id="results-title">공고 목록</h2>
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <details class="rule-note">
        <summary>조건 적용 방식</summary>
        <p>여러 조건은 모두 충족하는 공고만 보여 줍니다(같은 조건 안에서 고른 항목은 하나라도 해당하면 포함). 지원 자격이나 활동 일정이 불명확한 공고는 제외하지 않고 ‘확인 필요’로 표시해 포함합니다. 전 학과·학과 무관 공고는 학과를 골라도 항상 표시됩니다.</p>
      </details>
      <div id="chips" class="chips"></div>
      <div class="list-toolbar">
        <label for="page-size">한 페이지에 보기</label>
        <select id="page-size" class="select"></select>
      </div>
      <div id="list" class="list"></div>
      <nav id="pager" class="pager" aria-label="페이지 이동"></nav>
    </section>

    <section class="panel detail" id="detail-panel" aria-labelledby="detail-title">
      <div class="detail-header">
        <h2 id="detail-title">공고 상세</h2>
        <button type="button" id="detail-close" class="detail-close">닫기</button>
      </div>
      <div id="detail"></div>
    </section>
  </main>
  <div id="backdrop" class="backdrop"></div>

  <script src="data.js"></script>
  <script src="filter.js"></script>
  <script src="app.js"></script>
</body>
</html>
